# CineHome — OpenTelemetry (same path as banking)
# App → opentelemetry-collector.observability → dual Coroot + Instana
#
# movie-web (nginx SPA) relies on Coroot eBPF + traces from movie-api behind /api proxy.

movieApi:
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "movie-api"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-ocp,k8s.namespace.name=npd-movie,k8s.cluster.name=ocp01"
    OTEL_HEARTBEAT: "1"
    OTEL_HEARTBEAT_SECONDS: "30"

mediaWorker:
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "media-worker"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-ocp,k8s.namespace.name=npd-movie,k8s.cluster.name=ocp01"
    OTEL_HEARTBEAT: "1"
    OTEL_HEARTBEAT_SECONDS: "30"
