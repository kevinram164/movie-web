# Cloudflare remotely-managed tunnel cho cinehome.automationecom.click.
# Public hostname cấu hình trên Zero Trust dashboard: cinehome.automationecom.click → http://movie-web.npd-movie.svc.cluster.local:8080
# Token: Vault secret/cinehome/cloudflared.token → Vault Agent → /vault/secrets/token (--token-file, cloudflared >= 2025.4.0).
# Image distroless (không có shell) nên đọc token bằng --token-file thay vì source env.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: npd-movie
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: cinehome
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: npd-movie
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: cinehome
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: cinehome
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "cinehome-cloudflared"
        vault.hashicorp.com/agent-inject-secret-token: "secret/data/cinehome/cloudflared"
        vault.hashicorp.com/agent-inject-template-token: |-
          {{- with secret "secret/data/cinehome/cloudflared" -}}
          {{- .Data.data.token -}}
          {{- end -}}
    spec:
      serviceAccountName: cloudflared
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /vault/secrets/token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
