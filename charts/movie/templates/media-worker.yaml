{{- if .Values.mediaWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  labels:
    app.kubernetes.io/name: cinehome
    app.kubernetes.io/component: media-worker
spec:
  replicas: {{ .Values.mediaWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cinehome
      app.kubernetes.io/component: media-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinehome
        app.kubernetes.io/component: media-worker
        istio.io/dataplane-mode: ambient
      {{- if .Values.vault.enabled }}
      annotations:
        {{- include "cinehome.vault.podAnnotations" (dict "root" $ "keys" .Values.mediaWorker.secretEnvKeys) | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: media-worker
      containers:
        - name: media-worker
          image: "{{ .Values.mediaWorker.image.repository }}:{{ .Values.mediaWorker.image.tag | toString }}"
          imagePullPolicy: {{ .Values.mediaWorker.image.pullPolicy }}
          {{- if .Values.vault.enabled }}
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/env && exec python -m worker.main
          {{- end }}
          env:
            {{- range $k, $v := .Values.mediaWorker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if not .Values.vault.enabled }}
            {{- range .Values.mediaWorker.secretEnvKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.appSecretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.mediaWorker.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp/cinehome-work
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.mediaWorker.workVolumeSize | default "4Gi" }}
{{- end }}
